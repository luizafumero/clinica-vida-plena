<!DOCTYPE html>
<html lang="BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento - Clínica Vida Plena</title>
</head>

<body>
    <header>
        <h1>Clínica Vida Plena</h1>
        <nav>
            <a href="index.html">Início</a>
            <a href="agendamento.html">Agendamento</a>
        </nav>
    </header>

    <maim>
        <h2>Agende sua consulta</h2>
        <form action="#" methood="post">
            <label for="nome">Nome:</label>
            <input type="text" name="nome" id="nome">
            <br>
            <label for="email">Email:</label>
            <input type="email" name="email" id="email">
            <br>
            <label for="telefone">Telefone:</label>
            <input type="tel" name="telefone" id="telefone">
            <br>
            <label for="hora">Horário:</label>
            <input type="time" name="hora" id="hora">
            <br>
            <label for="especialidade">Especialidade</label>
            <select name="especialidade" id="especialidade">
                <option value="">Selecione uma opção</option>
                <option value="clinico-geral">Clínico Geral</option>
                <option value="cardiologia">Cardiologia</option>
                <option value="dermetologia">Dermatologia</option>
                <option value="pediatria">Pediatria</option>
            </select>
            <br>
            <label for="mensagem" id="mensagem"></label>
            <textarea name="mensagem" id="mensagem" rows="4"></textarea>
            <br>
            <button type="submit">Confirmar agendamento</button>
            
        </form>
    </maim>
    <footer>
        <p>
            Clínica Vida Plena - Todos os direitos reservados
        </p>
    </footer>
</body>

</html>
